services:
  postgres:
    image: postgres:16
    container_name: verityx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verityx
      POSTGRES_USER: verityx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verityx -d verityx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verityx-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verityx-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://verityx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/verityx
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${VERITYX_API_KEY:?Set VERITYX_API_KEY in .env}
      MEDIA_STORAGE_DIR: /app/data/media
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      HF_HOME: /app/data/media/.hf_cache
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verityx-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://verityx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/verityx
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_DIR: /app/data/media
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      VERITYX_AI_DETECTOR_MODELS: ${VERITYX_AI_DETECTOR_MODELS:-Organika/sdxl-detector,capcheck/ai-human-generated-image-detection}
      VERITYX_AI_DETECTION_THRESHOLD: ${VERITYX_AI_DETECTION_THRESHOLD:-0.75}
      HF_HOME: /app/data/media/.hf_cache
    volumes:
      - media_data:/app/data/media
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]

  outbox-dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verityx-outbox-dispatcher
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://verityx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/verityx
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_DIR: /app/data/media
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.outbox_dispatcher"]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verityx-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VERITYX_BACKEND_URL: http://api:8000
      VERITYX_API_KEY: ${VERITYX_API_KEY:?Set VERITYX_API_KEY in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: verityx-caddy
    restart: unless-stopped
    profiles: ["production"]
    environment:
      VERITYX_DOMAIN: ${VERITYX_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  media_data:
