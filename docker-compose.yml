services:
  postgres:
    image: postgres:16
    container_name: verityx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verityx
      POSTGRES_USER: verityx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verityx -d verityx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verityx-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verityx-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://verityx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/verityx
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${VERITYX_API_KEY:?Set VERITYX_API_KEY in .env}
      MEDIA_STORAGE_DIR: /app/data/media
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verityx-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://verityx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/verityx
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_DIR: /app/data/media
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
    volumes:
      - media_data:/app/data/media
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]

volumes:
  postgres_data:
  media_data:
