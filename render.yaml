databases:
  - name: verityx-db
    plan: basic-256mb
    databaseName: verityx
    user: verityx
    region: singapore

# Render Key Value is the managed Redis-compatible Celery broker.
# Choose a plan/region available to your Render account.
services:
  - type: keyvalue
    name: verityx-redis
    plan: starter
    region: singapore
    ipAllowList: []

  - type: web
    name: verityx-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python run_render.py
    region: singapore
    plan: standard
    healthCheckPath: /health
    disk:
      name: verityx-media
      mountPath: /var/data/media
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verityx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: verityx-redis
          type: keyvalue
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: MEDIA_STORAGE_DIR
        value: /var/data/media
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "52428800"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: HF_HOME
        value: /var/data/media/.hf_cache
      - key: VERITYX_AI_DETECTION_THRESHOLD
        value: "0.5"
      - key: PYTHON_VERSION
        value: "3.12.10"
